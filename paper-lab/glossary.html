<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>术语表 · Paper Lab</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  :root { --red:#A02C2C; --ink:#1a1a1a; --gray:#333; --soft:#5f5f5b; --line:#e6e4e0; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif; color:var(--ink); background:#fff; margin:0; line-height:1.85; font-size:15.5px; }
  .wrap { max-width:720px; margin:0 auto; padding:72px 24px 90px; }
  .eyebrow { font-family:"IBM Plex Mono",Consolas,monospace; color:var(--red); font-size:12px; letter-spacing:3px; }
  h1 { font-family:"IBM Plex Mono",Consolas,monospace; color:var(--red); font-size:29px; font-weight:600; margin:14px 0 18px; }
  .hline { width:36px; height:2px; background:var(--red); margin:0 0 22px; }
  p { color:var(--gray); }
  .nav { display:flex; justify-content:space-between; gap:16px; margin-top:48px; padding-top:22px; border-top:1px solid var(--line); font-family:"IBM Plex Mono",Consolas,monospace; font-size:13px; }
  .nav a { color:#8B3A3A; text-decoration:none; }
  dt { font-weight:600; margin-top:22px; }
  dd { margin:4px 0 0; color:var(--gray); }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">GLOSSARY</div>
  <h1>术语表</h1>
  <div class="hline"></div>
  <p>词条会随论文追加。正文里带点状下划线的词会链到本页对应 <code>id</code>。</p>
  <dl>
    <dt id="arxiv">arXiv</dt>
    <dd>预印本平台。本站默认用 arXiv id 作为文件名前缀。</dd>
    <dt id="digest">中文导读</dt>
    <dd>对论文问题、方法、结果、局限的核对式编译，不是逐句翻译。</dd>
  </dl>
  <div class="nav">
    <a href="index.html">← 返回目录</a>
    <a href="about.html">关于本站</a>
  </div>
</div>
</body>
</html>
